name: Terraform

# Infrastructure pipeline: fmt/validate/tflint/checkov on PRs, plan posted as PR comment,
# apply on merge to main (dev auto, prod behind a protected environment).
on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        required: true
      action:
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write      # OIDC -> AWS
  contents: read
  pull-requests: write # plan comments
  security-events: write

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"

jobs:
  # ------------------------------------------------------------------ static checks
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - name: terraform fmt
        run: terraform fmt -recursive -check -diff terraform/
      - name: terraform validate (all roots)
        run: |
          for d in terraform/bootstrap terraform/envs/dev terraform/envs/prod; do
            echo "::group::$d"; (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate -no-color); echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@v4
        with: { tflint_version: v0.53.0 }
      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact --chdir terraform
      - name: checkov (IaC security)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: checkov.sarif }

  # ------------------------------------------------------------------ plan
  plan:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["dev","prod"]') }}
    environment: ${{ matrix.environment }}-plan
    concurrency:
      group: tf-${{ matrix.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform/envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}"
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan \
            -var="admin_role_arns=[\"${{ secrets.AWS_ROLE_ARN }}\"]" \
            -var="slack_webhook_url=${{ secrets.SLACK_WEBHOOK_URL }}" \
            -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          tail -c 60000 plan.txt
          [ $code -eq 1 ] && exit 1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}-${{ github.sha }}
          path: terraform/envs/${{ matrix.environment }}/tfplan
          retention-days: 5
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env: { ENV_NAME: "${{ matrix.environment }}", EXIT: "${{ steps.plan.outputs.exitcode }}" }
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`terraform/envs/${process.env.ENV_NAME}/plan.txt`, 'utf8').slice(-60000);
            const status = process.env.EXIT === '0' ? 'No changes' : 'Changes detected';
            const marker = `<!-- tfplan-${process.env.ENV_NAME} -->`;
            const body = `${marker}\n### Terraform plan · \`${process.env.ENV_NAME}\` – ${status}\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  # ------------------------------------------------------------------ apply
  apply:
    needs: plan
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action != 'plan')
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        # On push: dev always; prod only when the PROD_ENABLED repo variable is "true".
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || (vars.PROD_ENABLED == 'true' && fromJSON('["dev","prod"]') || fromJSON('["dev"]')) }}
    # prod environment should have required reviewers configured in repo settings
    environment: ${{ matrix.environment }}
    concurrency:
      group: tf-${{ matrix.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform/envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}"
      - uses: actions/download-artifact@v4
        if: inputs.action != 'destroy'
        with:
          name: tfplan-${{ matrix.environment }}-${{ github.sha }}
          path: terraform/envs/${{ matrix.environment }}
      - name: terraform apply (saved plan)
        if: inputs.action != 'destroy'
        run: terraform apply -input=false -lock-timeout=10m tfplan
      - name: terraform destroy
        if: inputs.action == 'destroy'
        run: |
          terraform destroy -input=false -auto-approve -lock-timeout=10m \
            -var="admin_role_arns=[\"${{ secrets.AWS_ROLE_ARN }}\"]"
      - name: Outputs to summary
        if: inputs.action != 'destroy'
        run: |
          { echo "### \`${{ matrix.environment }}\` outputs"; echo '```'; terraform output -no-color; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
