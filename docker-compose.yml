# Local dev loop: the three services + Prometheus + Grafana, no Kubernetes needed.
name: msplatform-local

services:
  products:
    build: { context: services, dockerfile: Dockerfile, args: { SERVICE: products } }
    ports: ["8081:8080"]
  orders:
    build: { context: services, dockerfile: Dockerfile, args: { SERVICE: orders } }
    environment: { PRODUCTS_URL: http://products:8080 }
    ports: ["8082:8080"]
    depends_on: [products]
  gateway:
    build: { context: services, dockerfile: Dockerfile, args: { SERVICE: gateway } }
    environment: { PRODUCTS_URL: http://products:8080, ORDERS_URL: http://orders:8080 }
    ports: ["8090:8080"]
    depends_on: [products, orders]

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./scripts/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./scripts/local/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./scripts/local/grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./scripts/local/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dash.yml:ro
      - ./kubernetes/monitoring/dashboard-microservices.json:/var/lib/grafana/dashboards/microservices.json:ro
    ports: ["3300:3000"]
    depends_on: [prometheus]
