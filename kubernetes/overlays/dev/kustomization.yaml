apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microservices
labels:
  - pairs:
      environment: dev
    includeSelectors: false
resources:
  - ../../base/products
  - ../../base/orders
  - ../../base/gateway
  - ../../monitoring

# CI rewrites these with `kustomize edit set image <name>=<ecr-url>:<tag>`
images:
  - name: products
    newName: 064580992425.dkr.ecr.us-east-1.amazonaws.com/msplatform/products
    newTag: v1-202609221326
  - name: orders
    newName: 064580992425.dkr.ecr.us-east-1.amazonaws.com/msplatform/orders
    newTag: v1-202609221326
  - name: gateway
    newName: 064580992425.dkr.ecr.us-east-1.amazonaws.com/msplatform/gateway
    newTag: v1-202609221326

patches:
  # dev: single replica floor, tiny HPA ceiling
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: PodDisruptionBudget
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 0
