global: { scrape_interval: 10s, evaluation_interval: 10s }
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: products
    static_configs: [{ targets: ["products:8080"], labels: { service: products } }]
  - job_name: orders
    static_configs: [{ targets: ["orders:8080"], labels: { service: orders } }]
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8080"], labels: { service: gateway } }]
